<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/clientes.css">
    <link rel="stylesheet" href="../css/productos.css">
    <title>Clientes | Dashboard </title>
</head>
<body>

    <!-- HEADER -->
    <header class="header">

         <button id="btn-toggle" class="btn-toggle abrir">☰</button>

        <!-- ICONO PRINCIPAL -->
        <i class="fi fi-sr-users icono"></i>


        
        <!-- INFORMACION -->
        <div class="header-text">
            <h1>
                Administra tus Clientes
            </h1>
        </div>

        <!-- INFORMACIÓN DEL USUARIO -->
        <div class="usuario">

            <i class="fi fi-sr-user"></i>

            <div class="usuario-info">
                <strong>Administrador</strong>
                <span>Usuario del sistema</span>
            </div>

        </div>

    </header>

    <aside class="nav-lateral oculto" id="nav-lateral">

        <button id="btn-toggle" class="btn-toggle cerrar">✕</button>
        
        <ul>
            <li><a href="../index.html"> 
                <i class="fi fi-sr-home"></i>
                <strong>
                    Inicio
                </strong> 
            </a></li>
            
            <li><a href="../pages/productos.html"> 
                <i class="fi fi-sr-box-alt"></i>
                <strong>
                    Productos
                </strong> 
            </a></li>

            <li><a href="../pages/inventario.html"> 
                <i class="fi fi-sr-inventory-alt"></i>
                <strong>
                    Inventario
                </strong> 
            </a></li>

            <li><a href="../pages/ventas.html">
                <i class="fi fi-sr-shopping-cart"></i>
                <strong>
                    Ventas
                </strong> 
            </a></li>

            <li><a href="../pages/clientes.html"> 
                <i class="fi fi-sr-users"></i>
                <strong>
                    Clientes
                </strong> 
            </a></li>
            <li><a href="pages/categorias.html"> 
                <i class="fi fi-ss-category"></i>
                <strong>
                    Categorias
                </strong> 
            </a></li>
            <li><a href="pages/proveedores.html"> 
                <i class="fi fi-br-supplier-alt"></i>
                <strong>
                    Proveedores
                </strong> 
            </a></li>
        </ul>
    </aside>

    <main class="main">

        <section>

            <div class="formulario-clientes">

                <div class="cont-formulario">

                    <form action="" method="" class="formulario">
                        <div class="campo">
                            <label for="" id="nombre">Nombre del cliente</label>
                            <input type="text" class="input">
                        </div>
                        <div class="campo">
                            <label for="" >Apellidos</label>
                            <input type="text" id="apellidos" class="input">
                        </div>
                        <div class="campo">
                            <label for="" >Cédula</label>
                            <input type="number" id="cedula" class="input">
                        </div>
                        <div class="campo">
                            <label for="" >Telefono</label>
                            <input type="tel" id="telefono" class="input">
                        </div>
                        <div class="campo">
                            <label for="" >Correo</label>
                            <input type="email" id="correo" class="input">
                        </div>
                        <div class="campo">
                            <label for="" >Dirección</label>
                            <input type="text" id="direccion" class="input">
                        </div>
                        <button type="submit" id="btn-registrar" class="btn-registrar"> 
                            <i class="fi fi-sr-plus"></i>
                            Registra Cliente
                        </button>

                        <div id="mensaje" class="mensaje"></div>
                    </form>

                </div>

            </div>
        
            

        </section>

    </main>


   

<script src="../js/clientes.js"></script>
</body>
</html>
