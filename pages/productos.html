<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/productos.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
    <title>Productos</title>
</head>
<body>
    <!-- HEADER -->
    <header class="header">

        <!-- ICONO VOLVER  -->
       <a href="../index.html" class="btn-volver">
           <i class="fi fi-sr-arrow-left"></i>
       </a>

        <!-- ICONO PRINCIPAL -->
        <i class="fi fi-sr-box-alt icono"></i>
        
        <!-- INFORMACION -->
        <div class="header-text">
            <h1>
                Registra y gestiona productos  
            </h1>
        </div>

        <!-- INFORMACIÓN DEL USUARIO -->
        <div class="usuario">

            <i class="fi fi-sr-user"></i>

            <div class="usuario-info">
                <strong>Administrador</strong>
                <span>Usuario del sistema</span>
            </div>

        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main">     

        <div class="formulario-y-tabla">

            <!-- CONTENIDO DE FORMLARIO  -->
            <div class="cont-formulario">

                 <form action="" method="" class="formulario">

                     <div class="campo">
                         <label for=""> Nombre de produto </label>
                         <input type="text" class="input-formulario" id="produto" placeholder="Ej. Portátil">
                     </div>

                     <div class="campo">
                         <label for=""> Stock </label>
                         <input type="number" class="input-formulario" id="stock" placeholder="Ej. 100">
                     </div>

                     <div class="campo">
                         <label for=""> Categoría </label>
                         <input type="text" class="input-formulario" id="categoria" placeholder="Ej. TE AMO, MI FLACA ">
                     </div>

                     <div class="campo">
                         <label for=""> Valor Unitario </label>
                         <input type="number" min="0" step="0.01" class="input-formulario" id="valor" placeholder="Ej. $ 12.000">
                     </div>

                     <div class="campo">
                         <label for=""> Proovedor </label>
                         <input type="text" class="input-formulario" id="proveedor" placeholder="Ej. Colombia SAS">
                     </div>

                     <button type="submit" id="btn-guardar" class="btn-guardar"> Guardar Producto </button>

                 </form>

            </div>

            

            <!-- TABLA Y CONTENIDO -->
            <div class="cont-tabla">

                

                <table class="table">
      
                    <caption>  Productos Regitrados </caption>

                    <!-- ENCABEZADOS DE LA TABLA -->
                    <thead class="encabezados">
                        <tr>
                            <th>Productos</th>
                            <th>Stock</th>
                            <th>Categoria</th>
                            <th>Valor Unitario</th>
                            <th>Proveedor</th>
                            <th>Acciones</th>
                        </tr> 
                    </thead>

                    <tbody id="tabla-productos">
                    
                      
                            
                        </tr>

                        <tr class="filas">
                            <td>
                                Desktop DELL
                            </td>
                            <td>
                                120
                            </td>
                             <td>
                                PC
                            </td> 
                            <td>
                                1200
                            </td>
                            <td>
                                Celu-Fer SAS
                            </td>

                            <!-- BOTONES DE ACCIONES -->
                            <td>
                                <button class="btn-editar">
                                    <i class="fi fi-sr-pencil"></i>
                                </button>
                                <button class="btn-eliminar">
                                    <i class="fi fi-sr-trash"></i>
                                </button>
                            </td>
                            
                        </tr>    

                    </tbody>

                </table>

                

            </div>   
            
        </div>

        <!-- <div class="barra-busqqueda">
            <input type="search" class="input-busqueda">
        </div> -->

    </main>

<script src="../js/productos.js"></script>
</body>
</html>
